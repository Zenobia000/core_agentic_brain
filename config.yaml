# 主配置 - 極簡版
# Linus: "Good defaults are better than options"

version: "1.0"
mode: standard  # 預設用 Layer 1（智慧路由）

# 核心配置
core:
  llm:
    provider: openai
    model: gpt-3.5-turbo  # 夠快夠便宜
    temperature: 0.7
    max_tokens: 2000

  tools:
    enabled:
      - python
      - files

# 路由（Layer 1）
routing:
  enabled: true  # 預設開啟智慧路由

# 就這些。其他都是過度設計。