# Core Agentic Brain - 主配置
# Linus: "Good defaults are better than options"

version: "2.0"
mode: standard

# LLM 配置（使用環境變數設定 API key）
llm:
  provider: openai
  model: gpt-3.5-turbo
  temperature: 0.7
  max_tokens: 2000

# 工具
tools:
  enabled:
    - python
    - files

# 路由
routing:
  enabled: true

# 詳細配置請參考 config.example.yaml
# 日誌設定請使用環境變數（見 .env.example）