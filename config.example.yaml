# Core Agentic Brain - 配置範例
# Linus: "Good defaults are better than options"
#
# 使用方法：
# 1. 複製此檔案為 config.yaml
# 2. 設定環境變數（推薦）或直接填入 API key
# 3. 其他保持預設即可
#
# API Keys 管理：
# - 優先使用環境變數：OPENAI_API_KEY, ANTHROPIC_API_KEY 等
# - 或創建 .env 檔案（自動載入）
# - 絕不要提交 API key 到版本控制

version: "2.0"
mode: standard  # minimal | standard | advanced

# ===================================
# LLM 配置（核心功能）
# ===================================
llm:
  # 預設配置 - OpenAI GPT-3.5（便宜快速）
  provider: openai           # openai | anthropic | azure | google | ollama
  model: gpt-3.5-turbo
  temperature: 0.7
  max_tokens: 2000
  # api_key: 使用環境變數 OPENAI_API_KEY

  # --- 其他 Provider 範例（取消註解使用）---

  # Anthropic Claude（更強大）
  # provider: anthropic
  # model: claude-3-haiku-20240307    # 便宜快速
  # model: claude-3-5-sonnet-20241022  # 平衡選擇
  # base_url: https://api.anthropic.com/v1/
  # max_tokens: 4096

  # Azure OpenAI（企業用戶）
  # provider: azure
  # model: gpt-4o-mini
  # base_url: https://{YOUR_RESOURCE}.openai.azure.com
  # api_version: 2024-08-01-preview
  # deployment_id: {YOUR_DEPLOYMENT}

  # Google Gemini（免費額度）
  # provider: google
  # model: gemini-2.0-flash-exp
  # base_url: https://generativelanguage.googleapis.com/v1beta/

  # Ollama（本地運行）
  # provider: ollama
  # model: llama3.2
  # base_url: http://localhost:11434/v1
  # api_key: ollama  # Ollama 不需要真實 API key

# ===================================
# 工具配置
# ===================================
tools:
  enabled:
    - python      # Python 執行器
    - files       # 檔案操作
    - terminate   # ReAct 循環終止信號
    - ask_user    # 向用戶請求澄清（OpenManus 風格）
    # - websearch   # 網路搜尋（需要 API key，見下方）
    # - browser     # 瀏覽器自動化（需要額外設定）

# ===================================
# Web Search 配置（可選）
# ===================================
# 啟用 websearch 工具後需要設定 API key（環境變數）：
# - SERPER_API_KEY: Serper.dev Google Search API（推薦）
# - TAVILY_API_KEY: Tavily AI Search API（替代方案）
websearch:
  default_num_results: 5
  max_results: 10

# ===================================
# 路由配置（智慧任務分配）
# ===================================
routing:
  enabled: true
  strategy: auto  # auto | simple | complex

# ===================================
# 工作區配置（檔案產物管理）
# ===================================
workspace:
  root: workspace  # 工作區根目錄

# ===================================
# 日誌配置
# ===================================
logging:
  console_level: INFO    # 控制台日誌級別: DEBUG, INFO, WARNING, ERROR
  file_level: DEBUG      # 檔案日誌級別: DEBUG, INFO, WARNING, ERROR
  log_dir: workspace/logs  # 日誌檔案目錄

# ===================================
# 可選功能（按需啟用）
# ===================================

# 搜尋引擎進階設定（一般使用上方 websearch 預設即可）
# websearch:
#   default_num_results: 5
#   max_results: 10
#   fallback_engines: [duckduckgo, bing]
#   lang: en
#   country: us

# 程式碼沙盒（安全執行）
# sandbox:
#   enabled: false  # 預設直接執行（開發環境）
#   type: docker    # docker | local
#   image: python:3.12-slim
#   memory_limit: 1g
#   cpu_limit: 2.0
#   timeout: 300

# 日誌設定已移至上方 logging 區段
# 環境變數 LOG_DEBUG=true 可啟用除錯模式

# ===================================
# 對話記憶體配置（跨請求上下文管理）
# ===================================
memory:
  # 壓縮策略
  # - simple: 簡單滑動窗口（預設，推薦）
  # - summary: LLM 摘要壓縮（較慢，效果較好）
  # - hybrid: 混合策略（平衡）
  strategy: simple

  # 最大訊息數：超過此數量觸發壓縮
  # 建議：30-100，視 token 預算調整
  max_messages: 50

  # 窗口大小：壓縮時保留最近 N 條訊息
  # 建議：10-30，太小會失去上下文，太大會浪費 token
  window_size: 20

# Memory 使用說明：
# - 記憶體會自動管理，無需手動操作
# - CLI 指令：'memory' 查看狀態，'reset' 重置歷史
# - 壓縮時會保留：系統提示 + 壓縮標記 + 最近 window_size 條訊息
# - 範例：max=50, window=20 → 達到 40 條時壓縮，保留最近 20 條

# ===================================
# ReAct 循環配置
# ===================================
# 注意: token_budget 需配合模型 context limit:
#   - GPT-3.5-turbo: 16K → token_budget: 12000
#   - GPT-4o-mini:   128K → token_budget: 100000
#   - Claude:        200K → token_budget: 150000
react:
  max_steps: 10                    # Maximum loop iterations (防止無限循環)
  token_budget: 12000              # Summarization threshold - 配合 GPT-3.5-turbo 16K limit
  token_warning_threshold: 0.7     # Warning at 70% of threshold (earlier for small models)
  max_consecutive_errors: 3        # Circuit breaker threshold
  repetition_window: 5             # Window for repetition detection
  enable_summarization: true       # Auto-summarize when approaching threshold
  # Design: Trust model's native context window
  # Reference: Claude Code / Cursor use warning + auto-summarize, not hard-break

# ===================================
# 進階配置（一般不需要修改）
# ===================================

# Agent 設定
# agents:
#   planner:
#     enabled: true
#     model: null  # 使用全局 LLM 設定
#   executor:
#     enabled: true
#   reviewer:
#     enabled: true
#     threshold: 0.8

# 系統限制
# limits:
#   max_iterations: 10
#   max_retries: 3
#   request_timeout: 60
#   total_timeout: 600

# ===================================
# 最佳實踐
# ===================================
# 1. 從最簡配置開始（只設定 API key）
# 2. 遇到問題再增加配置
# 3. 保持配置文件少於 50 行
# 4. 使用環境變數管理敏感資訊
#
# Linus 說：
# "Complexity is the enemy. Simplicity is prerequisite."
# "如果你需要超過 3 層配置，你的設計就錯了。"